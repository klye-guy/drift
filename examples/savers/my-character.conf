# Template for your own artwork. Put your image next to this file (or give
# an absolute / ~/ path), rename the file to whatever you want the saver
# called, and it shows up in `drift list` — no rebuild needed.
#
# Transparent PNGs look best: only the character moves, the rest stays black.
# For animation use an animated GIF, or point image at a folder of numbered
# PNG frames (e.g. an export from Clip Studio) and set fps.
kind        = sprite
description = My character wandering the screen
image       = my-character.png
motion      = wander     # bounce | drift | float | wander
height      = 0.45       # fraction of screen height
speed       = 140
flip        = true       # face the direction of travel
# fps       = 12         # only for a folder of frames
# trail     = 0.3        # ghost trail; 0 = off
